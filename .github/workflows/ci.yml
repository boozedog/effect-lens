name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    name: Verify (lint, format, typecheck, tests, dogfood, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nub (pinned 0.7.5)
        env:
          NUB_VERSION: 0.7.5
          NUB_SHA256: 34ad027792b7702e88f71eadde9fc2bf4ebade13a1c91b92fa056954f15880eb
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nub"
          curl -fsSL "https://github.com/nubjs/nub/releases/download/v${NUB_VERSION}/nub-linux-x64.tar.gz" -o "$HOME/.nub/nub.tar.gz"
          echo "${NUB_SHA256}  ${HOME}/.nub/nub.tar.gz" | sha256sum -c -
          tar -xzf "$HOME/.nub/nub.tar.gz" -C "$HOME/.nub"
          rm "$HOME/.nub/nub.tar.gz"
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Nub store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nub/store/v1
          key: nub-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Run canonical validation
        run: nub run verify

  release:
    name: Release self-review
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nub (pinned 0.7.5)
        env:
          NUB_VERSION: 0.7.5
          NUB_SHA256: 34ad027792b7702e88f71eadde9fc2bf4ebade13a1c91b92fa056954f15880eb
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.nub"
          curl -fsSL "https://github.com/nubjs/nub/releases/download/v${NUB_VERSION}/nub-linux-x64.tar.gz" -o "$HOME/.nub/nub.tar.gz"
          echo "${NUB_SHA256}  ${HOME}/.nub/nub.tar.gz" | sha256sum -c -
          tar -xzf "$HOME/.nub/nub.tar.gz" -C "$HOME/.nub"
          rm "$HOME/.nub/nub.tar.gz"
          echo "$HOME/.nub/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Nub store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nub/store/v1
          key: nub-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        run: nub install --frozen-lockfile
      - name: Run release self-review
        run: nub run release:check
